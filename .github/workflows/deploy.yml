name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Production
    permissions:
      contents: write  # Required to push tags
      deployments: write  # Required for Cloudflare Pages action to create GitHub deployments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-increment Version
        id: version
        run: |
          echo "📦 Determining version from git tags..."
          
          # Fetch all tags
          git fetch --tags
          
          # Get latest version tag (or default to 0.0.0)
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
            echo "No existing version tags found, starting from 0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
            echo "Latest version tag: $LATEST_TAG"
          fi
          
          # Parse version parts
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          
          # Check commit message for version bump type
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          if [[ "$COMMIT_MSG" == *"[major]"* ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]] || [[ "$COMMIT_MSG" == *"feat:"* ]] || [[ "$COMMIT_MSG" == *"feature:"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          else
            # Default to patch for any other commit (fix:, chore:, etc.)
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION (${BUMP_TYPE} bump)"
          
          # Create new git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          
          # Export version for build
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version bumped to $NEW_VERSION and tagged"

      - name: Run D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🗄️ Running database migrations..."
          for migration in migrations/*.sql; do
            if [ -f "$migration" ]; then
              echo "📝 Applying $(basename $migration)..."
              npx wrangler d1 execute koodiapina_net_db --remote --file "$migration" || echo "⚠️ Migration may already exist, continuing..."
            fi
          done
          echo "✅ Migrations complete!"
          echo "⏭️  Skipping seed files (migrations/seeds/) - production data only"

      - name: Update Service Worker Cache Version
        run: |
          echo "🔄 Updating service worker cache version..."
          TIMESTAMP=$(date +%s)
          sed -i "s/CACHE_NAME = '[^']*'/CACHE_NAME = 'koodiapina-ruoka-v${TIMESTAMP}'/" public/service-worker.js
          echo "✅ Cache version updated to v${TIMESTAMP}"

      - name: Update package.json version
        run: |
          echo "📝 Updating package.json version to ${{ steps.version.outputs.version }}..."
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          echo "✅ package.json version updated"

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying main API worker..."
          cd workers/recipes_api && npx wrangler deploy --var APP_VERSION:${{ steps.version.outputs.version }} --var BUILD_TIME:$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "🚀 Deploying background workers..."
          # recipe_sync_* are kept deployed with `crons = []` so their schedules
          # stay removed; see workers/recipe_sync_ids/wrangler.toml to re-enable.
          cd ../recipe_sync_ids && npx wrangler deploy
          cd ../recipe_sync_instructions && npx wrangler deploy
          cd ../recipe_search_populate && npx wrangler deploy
          echo "✅ All workers deployed"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying frontend to Cloudflare Pages..."
          npx wrangler pages deploy ./dist --project-name=koodiapina-net --branch=cloudflare
          echo "✅ Frontend deployed"

      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "🧹 Purging Cloudflare cache..."
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || echo "⚠️ Cache purge failed, but deployment continues"
          echo "✅ Cloudflare cache purged"

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment complete!"
          echo "================================"
          echo "📋 Deployment Summary:"
          echo "🏷️  Version: v${{ steps.version.outputs.version }}"
          echo "📦 Frontend: https://ruoka.koodiapina.net"
          echo "⚙️  API Worker: https://koodiapina-net.leinonen-op.workers.dev"
          echo "🗄️ Database: koodiapina_net_db"
          echo "🧹 Cache: Purged & Service Worker updated"
          echo "================================"
